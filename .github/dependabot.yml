# Wöchentlich nach Sicherheits- und Versionsupdates schauen.
# cooldown: neue Versionen erst nach einigen Tagen vorschlagen (schützt vor frisch kompromittierten Paketen).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
