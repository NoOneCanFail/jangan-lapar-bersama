name: Datenbank wach halten

# Kostenlose Supabase-Projekte pausieren nach 7 Tagen ohne Aktivität.
# Dieser Job ruft alle 3 Tage eine harmlose Funktion auf.
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          if [ ! -f .env.production ]; then echo "Noch kein Supabase verbunden."; exit 0; fi
          set -a; . ./.env.production; set +a
          curl -fsS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}'
