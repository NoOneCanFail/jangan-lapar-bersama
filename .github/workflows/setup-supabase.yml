name: Supabase einrichten

# Einmalig von Hand starten: Actions → "Supabase einrichten" → Run workflow.
# Voraussetzung: Repository-Secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
# Der Token wird nur hier benutzt und nie ausgegeben. Nach der Einrichtung kann er gelöscht werden.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase Project Reference oder Projekt-Adresse"
        required: true
      aktion:
        description: "Was tun?"
        type: choice
        default: einrichten
        options:
          - einrichten
          - registrierung-schliessen
          - registrierung-oeffnen

permissions:
  contents: write
  actions: write

concurrency:
  group: supabase-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Supabase-Projekt einrichten
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          ENV_FILE: .env.production
          AKTION: ${{ inputs.aktion }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt."; exit 1; fi
          # Akzeptiert die Reference allein oder eine ganze Projekt-Adresse
          REF=$(printf '%s' "$PROJECT_REF" | tr 'A-Z' 'a-z' | grep -oE '[a-z0-9]{20}' | head -1 || true)
          if [ -z "$REF" ]; then echo "::error::Keine Project Reference (20 Zeichen) erkannt."; exit 1; fi
          echo "Project Reference: $REF"
          APP_URL=$(printf '%s' "$APP_URL" | tr 'A-Z' 'a-z')
          case "$AKTION" in
            registrierung-schliessen) export SIGNUPS=schliessen ;;
            registrierung-oeffnen) export SIGNUPS=oeffnen ;;
          esac
          node scripts/setup-supabase.mjs "$REF" "$APP_URL"
      # Auch bei Teilerfolg speichern, damit der öffentliche Push-Schlüssel nicht verloren geht.
      - name: Öffentliche Werte speichern
        if: ${{ always() && hashFiles('.env.production') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.production
          if git diff --cached --quiet; then echo "Keine Änderung."; else git commit -m "Supabase verbunden (öffentliche Werte)"; git push; fi
      - name: App neu veröffentlichen
        if: ${{ inputs.aktion == 'einrichten' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
